<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6f86"><title>Conference English Trainer</title><link rel="stylesheet" href="./app.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body>
<header><small>SITUATION → CHUNKS → SPEAK</small><h1>Conference English Trainer</h1></header>
<main>
  <div class="bar card topbar">
    <div class="catline">
      <div class="catlabel">カテゴリ</div>
      <div id="cats" class="cats"></div>
    </div>
    <div class="sceneline">
      <select id="scene"></select>
      <span id="count"></span>
    </div>
  </div>
  <div class="card main"><div class="head"><div><b id="cat"></b><h2 id="title"></h2><span id="sub"></span></div><button id="star">☆</button></div>
<section><label>Situation</label><p id="sit"></p></section>
<section><div class="row"><label>Practice</label><div><button id="hideAll">全部隠す</button><button id="showAll">全部表示</button></div></div><p class="guide">英語チャンクをタップすると、隠す／正解を見るを切り替えます。日本語もタップで隠せます。</p></section>
<section><div class="row"><label>Conversation</label><button id="playAll">🔊 会話を聞く</button></div><div id="dlg"></div></section>
<details><summary>表現のポイント</summary><p id="tip"></p></details></div></main>
<nav><button id="prev">←</button><button id="next">次のScene →</button></nav><script src="./app.js"></script></body></html>
